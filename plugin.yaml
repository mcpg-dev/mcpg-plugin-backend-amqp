schema: mcpg.dev/plugin/v1
id: dev.mcpg.backend.amqp
name: AMQP Binding
license: Apache-2.0
description: |
  Runs AMQP 0.9.1 (RabbitMQ) messaging operations as MCP tools and resources.
  `op: publish` sends a message (with a publisher confirm + mandatory-routing
  check); `op: rpc` does request/reply (publishes with reply_to +
  correlation_id and awaits the correlated reply on a private exclusive
  queue); `op: get` pulls one message from a queue. The message body is the
  tool's arguments JSON. Connections are reused (lapin) over rustls TLS; the
  broker URI/password resolves through the gateway secret-resolver
  (`${env.X}` / `vault://...`). Complements the kafka/nats backends.

  A `watch_strategy` (kind `amqp_queue`) consumes a queue with manual
  acknowledgement: each message is an MCP Event, acked once the gateway has
  stored it and requeued when the gateway has not done so in
  `ack_timeout_ms`, so delivery is at-least-once. `max_in_flight` is the
  prefetch; the queue can be declared and bound to exchanges first.
class: backend
runtime: native-cdylib-v1
protocol_version: "1.0"
required_capabilities: [network_outbound]
# MCP Events: the broker keeps what is not acknowledged, so the watch needs
# no stored position.
watch_strategies:
  - kind: amqp_queue
    placement: single_owner
    resume: false
    event_types:
      - name: amqp.message
        description: One message consumed from the watched queue. The eventId is the message_id property, when the publisher sets it.
        payload_schema:
          type: object
          required: [queue, exchange, routingKey, redelivered, headers, body, bodyEncoding]
          properties:
            queue: { type: string }
            exchange: { type: string }
            routingKey: { type: string }
            redelivered: { type: boolean }
            messageId: { type: string }
            correlationId: { type: string }
            replyTo: { type: string }
            contentType: { type: string }
            contentEncoding: { type: string }
            type: { type: string }
            appId: { type: string }
            userId: { type: string }
            expiration: { type: string }
            priority: { type: integer }
            deliveryMode: { type: integer }
            timestamp: { type: string, description: The timestamp property, RFC 3339. }
            headers: { type: object }
            body:
              description: The message body, read as bodyEncoding says; null when bodyTruncated.
            bodyEncoding:
              description: How body holds the message body - its JSON, its UTF-8 text, or standard base64 of its bytes.
              enum: [json, text, base64, null]
            bodyTruncated: { type: boolean, description: The body was larger than max_body_bytes and is left out. }
            bodySize: { type: integer, description: The size of a body left out, in bytes. }
